name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.4.0
permissions:
  contents: read
jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download published packages and trusted catalogs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: pwsh
        run: gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir dist --pattern "*.zip" --pattern "catalog*.json" --pattern "SHA256SUMS.txt" --pattern "*.sig"
      - name: Verify release data and exported ABI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: pwsh
        run: |
          ./scripts/verify-signatures.ps1
          python scripts/verify.py dist/catalog-stable.json --abi-check --release-tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Stable package validation failed" }
          python scripts/verify.py dist/catalog-preview.json --abi-check --release-tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Preview package validation failed" }
