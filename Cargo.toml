[workspace]
resolver = "2"
members = ["crates/driver-ffi", "drivers/razer-deathadder-v3-pro", "drivers/mchose-a5-ultra", "drivers/mchose-g75-pro", "drivers/hecate-g2-pro", "crates/protocol-hidpp", "drivers/logitech-g305", "crates/protocol-razer", "drivers/razer-basilisk-v3-pro-wired", "crates/hid-transport", "crates/protocol-mchose-v3", "drivers/mchose-a7-v3-ultra-plus", "crates/protocol-vgn", "drivers/vgn-f2-master-plus"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/chenran0408/peripheral-desk-drivers"

[workspace.dependencies]
# SDK is pinned to an immutable reviewed core commit; see docs/ABI.md.
peripheral-desk = { git = "https://github.com/chenran0408/peripheral-desk", rev = "ef82c5f9989413189de7848d03a7e0eb8c282fd5", default-features = false, features = ["driver-runtime"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
